<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault</title>
<style>
:root{--bg:#0b0d12;--panel:#12151c;--line:#232836;--text:#e8ebf2;--muted:#8a92a6;--a:#7c8cff;--b:#b07cff;--danger:#ff6b7a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 80% -10%,#1c2140,transparent 60%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:28px;margin:0 0 4px}
h1 span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0 0 28px}
#drop{border:1.5px dashed #323a52;background:var(--panel);border-radius:18px;padding:38px 20px;text-align:center;cursor:pointer;transition:.15s}
#drop:hover,#drop.over{border-color:var(--a);box-shadow:0 0 0 4px #7c8cff18}
#drop b{display:block;font-size:17px;margin:10px 0 2px}
#drop small{color:var(--muted)}
.ico{width:44px;height:44px;margin:auto;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));font-size:22px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:34px 2px 12px}
.item{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ext{flex:none;width:42px;height:42px;border-radius:10px;background:#1d2232;color:var(--a);display:grid;place-items:center;font-size:11px;font-weight:700;text-transform:uppercase;overflow:hidden}
.info{flex:1;min-width:0}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.meta{color:var(--muted);font-size:12.5px}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:7px;overflow:hidden}
.bar u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b))}
.btn{font:inherit;color:var(--text);background:#1e2333;border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--a)}
.dl{background:linear-gradient(135deg,var(--a),var(--b));border:0;color:#fff;font-weight:600}
.del{color:var(--muted);padding:8px 10px}
.del:hover{color:var(--danger);border-color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:34px 0;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2030;border:1px solid var(--line);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s}
#toast.show{opacity:1}
#toast.err{border-color:var(--danger)}
</style>
</head>
<body>
<div class="wrap">
  <h1><span>Vault</span> file drop</h1>
  <p class="sub">Drop any file in. Download it from any device.</p>

  <div id="drop">
    <div class="ico">↑</div>
    <b>Drop files here or click to browse</b>
    <small>Any file type, any size</small>
    <input id="pick" type="file" multiple hidden>
  </div>

  <div id="qwrap" hidden><h2>Uploading</h2><div id="queue"></div></div>

  <h2>Stored files <span id="count"></span></h2>
  <div id="list"><div class="empty">Loading…</div></div>
</div>
<div id="toast"></div>

<script type="module">
import { upload } from "https://esm.sh/@vercel/blob@2.3.0/client";

const $ = (id) => document.getElementById(id);
const mk = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const ext = (n) => (/\.([A-Za-z0-9]{1,5})$/.exec(n) || [, "file"])[1];
const fmt = (n) => { if (n < 1024) return n + " B"; const u = ["KB","MB","GB","TB"]; let i = -1; do { n /= 1024; i++; } while (n >= 1024 && i < 3); return n.toFixed(n < 10 ? 1 : 0) + " " + u[i]; };
function toast(m, err) { const t = $("toast"); t.textContent = m; t.className = "show" + (err ? " err" : ""); clearTimeout(toast.t); toast.t = setTimeout(() => (t.className = ""), 3500); }

async function api(url, opts = {}) {
  const r = await fetch(url, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j;
}

async function refresh() {
  try {
    const files = await api("/api/files");
    $("count").textContent = files.length ? `(${files.length})` : "";
    const list = $("list"); list.textContent = "";
    if (!files.length) return list.append(mk("div", "empty", "No files yet. Upload one above."));
    for (const f of files) {
      const row = mk("div", "item"), info = mk("div", "info");
      info.append(mk("div", "name", f.name), mk("div", "meta", `${fmt(f.size)} · ${new Date(f.at).toLocaleString()}`));
      const dl = mk("a", "btn dl", "Download"); dl.href = f.downloadUrl;
      const del = mk("button", "btn del", "✕"); del.title = "Delete";
      del.onclick = async () => {
        if (!confirm(`Delete "${f.name}"?`)) return;
        try { await api("/api/files?url=" + encodeURIComponent(f.url), { method: "DELETE" }); refresh(); }
        catch (e) { toast(e.message, true); }
      };
      row.append(mk("div", "ext", ext(f.name)), info, dl, del);
      list.append(row);
    }
  } catch (e) { $("list").textContent = ""; $("list").append(mk("div", "empty", e.message)); }
}

async function uploadOne(file) {
  const row = mk("div", "item"), info = mk("div", "info"), bar = mk("div", "bar"), fill = mk("u");
  bar.append(fill);
  info.append(mk("div", "name", file.name), mk("div", "meta", fmt(file.size)), bar);
  row.append(mk("div", "ext", ext(file.name)), info);
  $("queue").prepend(row); $("qwrap").hidden = false;
  try {
    await upload(`${Date.now()}-${file.name}`, file, {
      access: "public",
      handleUploadUrl: "/api/upload",
      multipart: true,
      onUploadProgress: ({ percentage }) => (fill.style.width = percentage + "%"),
    });
    toast("Uploaded " + file.name);
  } catch (e) {
    toast(`${file.name}: ${e.message}`, true);
  } finally {
    row.remove(); if (!$("queue").children.length) $("qwrap").hidden = true;
    refresh();
  }
}

const drop = $("drop"), pick = $("pick");
const go = async (list) => { for (const f of Array.from(list)) await uploadOne(f); };
drop.onclick = () => pick.click();
pick.onchange = () => { go(pick.files); pick.value = ""; };
["dragenter", "dragover"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => go(e.dataTransfer.files));
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("drop", (e) => e.preventDefault());

refresh();
</script>
</body>
</html>
